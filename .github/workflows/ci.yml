name: CI - Testes automatizados

# Gatilho: roda sempre que um Pull Request para a main for aberto, atualizado
# (novo commit na branch) ou reaberto.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Se o PR receber um commit novo enquanto a esteira roda, cancela a execução antiga.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 - Testes de caixa-branca (Atividade 2): unitários e de integração.
  # Não precisam de banco nem da aplicação rodando.
  # ---------------------------------------------------------------------------
  testes-unitarios:
    name: Testes unitários e de integração (API e Client)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Backend - JUnit, Mockito e MockMvc
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Frontend - instalar dependências
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Frontend - Jest e Testing Library
        working-directory: client
        run: npm test -- --ci

  # ---------------------------------------------------------------------------
  # JOB 2 - Testes de caixa-preta (Atividade 3): E2E e de API.
  # Sobe MySQL + API + Client de verdade e roda o Playwright contra eles.
  # ---------------------------------------------------------------------------
  testes-e2e-api:
    name: Testes E2E e de API (sistema rodando)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Banco de dados MySQL, disponível em localhost:3306 durante o job.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # A API lê estas variáveis no lugar dos valores do application.properties.
    env:
      SPRING_DATASOURCE_URL: "jdbc:mysql://localhost:3306/sqa_social?allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests/package-lock.json

      - name: API - empacotar (gera o .jar)
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package

      - name: API - iniciar em segundo plano
        run: nohup java -jar api/target/*.jar > api.log 2>&1 &

      - name: API - aguardar ficar pronta (porta 8080)
        run: |
          timeout 120 bash -c 'until curl -s -o /dev/null --max-time 5 "http://localhost:8080/posts?limit=1"; do sleep 3; done'

      - name: Client - instalar dependências e gerar o build
        working-directory: client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Client - iniciar em segundo plano
        working-directory: client
        run: nohup npm start > ../client.log 2>&1 &

      - name: Client - aguardar ficar pronto (porta 3000)
        run: |
          timeout 120 bash -c 'until curl -s -o /dev/null --max-time 5 http://localhost:3000; do sleep 3; done'

      - name: Testes - instalar dependências e o navegador (Playwright)
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Testes - executar E2E e API (Playwright)
        working-directory: tests
        run: npx playwright test

      # Guarda relatório e logs para consultar mesmo quando algo falha.
      - name: Salvar relatório e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-e-logs
          path: |
            tests/playwright-report
            tests/test-results
            api.log
            client/client.log
            client.log
          if-no-files-found: ignore
